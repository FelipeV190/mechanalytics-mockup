<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mechanalytics · Mockup funcional</title>
  <meta name="description" content="Mockup funcional de Mechanalytics: mantenimiento predictivo para flotas medianas con adaptador OBD-II." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M7 21V11l5 6 4-5 4 5 5-6v10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Mechanalytics</div>
    <nav class="modes">
      <button class="mode active" data-mode="app">App</button>
      <button class="mode" data-mode="finance">Plan financiero</button>
    </nav>
  </header>

  <main id="view-app" class="stage">
    <aside class="screens" id="screen-list" aria-label="Pantallas"></aside>
    <div class="device-wrap">
      <div class="device">
        <div class="phone" id="phone"></div>
      </div>
    </div>
    <aside class="caption" id="caption"></aside>
  </main>

  <main id="view-finance" class="finance" hidden></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
